<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Kanban Board</title>
<link rel="icon" type="image/png" href="/favicon.png"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1117;
    --surface: #181c27;
    --surface2: #1e2333;
    --surface3: #252a3d;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #e8eaf0;
    --text2: #8891aa;
    --text3: #565f7a;
    --accent: #5b6af0;
    --accent2: #7c89f5;
    --success: #22c55e;
    --warning: #f59e0b;
    --danger: #ef4444;
    --radius: 10px;
    --radius-sm: 6px;
    --shadow: 0 4px 24px rgba(0,0,0,0.35);
    --shadow-card: 0 2px 8px rgba(0,0,0,0.28);
  }

  html, body {
    height: 100%; background: var(--bg);
    font-family: 'DM Sans', sans-serif;
    color: var(--text); overflow: hidden;
  }

  /* ── HEADER ── */
  .header {
    height: 52px; background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; padding: 0 20px;
    gap: 16px; flex-shrink: 0;
    box-shadow: 0 1px 0 rgba(255,255,255,0.04);
  }
  .header-logo {
    font-weight: 700; font-size: 16px; letter-spacing: -0.4px;
    color: var(--text);
    display: flex; align-items: center; gap: 8px;
  }
  .header-logo-icon {
    width: 28px; height: 28px; background: var(--accent);
    border-radius: 7px; display: grid; place-items: center;
  }
  .header-logo-icon svg { width: 16px; height: 16px; fill: white; }
  .header-spacer { flex: 1; }
  .header-stats {
    display: flex; gap: 8px; align-items: center;
  }
  .stat-pill {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 20px; padding: 4px 12px;
    font-size: 12px; color: var(--text2);
    display: flex; align-items: center; gap: 5px;
  }
  .stat-pill span { color: var(--text); font-weight: 600; }
  .btn-add-col {
    background: var(--accent); color: white;
    border: none; border-radius: var(--radius-sm);
    padding: 6px 14px; font-size: 13px; font-weight: 500;
    cursor: pointer; display: flex; align-items: center; gap: 6px;
    transition: all .15s; font-family: inherit;
  }
  .btn-add-col:hover { background: var(--accent2); transform: translateY(-1px); }

  /* ── BOARD ── */
  .board-wrap { height: calc(100vh - 52px); overflow-x: hidden; overflow-y: auto; }
  .board {
    display: flex; flex-wrap: wrap; gap: 14px;
    padding: 16px 20px;
    align-items: flex-start;
  }

  /* ── COLUMN ── */
  .column {
    width: 278px; flex-shrink: 0;
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    display: flex; flex-direction: column;
    transition: box-shadow .2s;
  }
  .column.drag-over { box-shadow: 0 0 0 2px var(--accent), var(--shadow); }
  .col-header {
    padding: 0 12px; height: 44px;
    display: flex; align-items: center; gap: 8px;
    flex-shrink: 0; border-bottom: 1px solid var(--border);
  }
  .col-color-bar {
    width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0;
  }
  .col-title {
    font-size: 13px; font-weight: 600; flex: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .col-count {
    font-size: 11px; color: var(--text3);
    background: var(--surface3); border-radius: 20px;
    padding: 1px 7px; font-weight: 500;
  }
  .col-limit { color: var(--text2); }
  .col-menu-btn {
    background: none; border: none; cursor: pointer; color: var(--text3);
    padding: 4px; border-radius: 4px; display: grid; place-items: center;
    transition: .12s;
  }
  .col-menu-btn:hover { background: var(--surface3); color: var(--text2); }
  .col-drag-handle {
    cursor: grab; color: var(--text3); padding: 4px 2px;
    display: grid; place-items: center; opacity: 0;
    transition: opacity .15s;
  }
  .col-header:hover .col-drag-handle { opacity: 1; }
  .col-drag-handle:active { cursor: grabbing; }
  .column.col-dragging { opacity: .25; pointer-events: none; }
  .column.col-drag-over-left { box-shadow: -3px 0 0 var(--accent), var(--shadow); }
  .column.col-drag-over-right { box-shadow: 3px 0 0 var(--accent), var(--shadow); }

  /* Floating drag ghost */
  #col-ghost {
    position: fixed; z-index: 9999; pointer-events: none;
    width: 278px; opacity: .92;
    transform: rotate(2deg) scale(1.03);
    box-shadow: 0 16px 48px rgba(0,0,0,.6);
    border-radius: var(--radius);
    transition: transform .1s;
  }

  .cards-list {
    flex: 1; padding: 10px 10px;
    display: flex; flex-direction: column; gap: 8px;
  }

  .col-footer {
    padding: 8px 10px; flex-shrink: 0;
    border-top: 1px solid var(--border);
  }
  .btn-add-card {
    width: 100%; background: none; border: 1px dashed var(--border2);
    border-radius: var(--radius-sm); padding: 7px;
    color: var(--text3); font-size: 12px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 5px;
    transition: .15s; font-family: inherit;
  }
  .btn-add-card:hover { border-color: var(--accent); color: var(--accent); background: rgba(91,106,240,.06); }

  /* ── CARD ── */
  .card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 11px 12px; cursor: grab;
    transition: box-shadow .15s, transform .15s, border-color .15s;
    box-shadow: var(--shadow-card);
    position: relative;
  }
  .card:hover { border-color: var(--border2); box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
  .card.dragging { opacity: .5; cursor: grabbing; transform: rotate(1.5deg) scale(1.02); }

  .card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 7px; }
  .tag {
    font-size: 10px; font-weight: 600; padding: 2px 7px;
    border-radius: 3px; letter-spacing: .2px; text-transform: uppercase;
  }

  .card-title {
    font-size: 13px; font-weight: 500; line-height: 1.45;
    color: var(--text); margin-bottom: 8px;
  }

  .card-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
  .badge {
    display: flex; align-items: center; gap: 4px;
    font-size: 11px; padding: 2px 7px; border-radius: 4px;
    font-weight: 500;
  }
  .badge-priority-high { background: rgba(239,68,68,.15); color: #f87171; }
  .badge-priority-critical { background: rgba(239,68,68,.22); color: #ff5252; border: 1px solid rgba(239,68,68,.35); }
  .badge-priority-normal { background: rgba(59,130,246,.12); color: #93bbfd; }
  .badge-priority-low { background: rgba(34,197,94,.1); color: #4ade80; }
  .badge-done { background: rgba(34,197,94,.12); color: var(--success); border: 1px solid rgba(34,197,94,.2); }
  .badge-progress {
    background: var(--surface3); color: var(--text2);
  }

  .card-progress-bar {
    height: 3px; background: var(--surface3); border-radius: 2px;
    margin-bottom: 8px; overflow: hidden;
  }
  .card-progress-fill {
    height: 100%; border-radius: 2px; transition: width .3s;
  }

  .card-footer {
    display: flex; align-items: center; gap: 8px;
    flex-wrap: wrap;
  }
  .card-date {
    display: flex; align-items: center; gap: 4px;
    font-size: 11px; color: var(--text3);
  }
  .card-date svg { width: 11px; height: 11px; opacity: .6; }
  .card-date.overdue { color: #f87171; }

  .card-actions {
    position: absolute; top: 8px; right: 8px;
    display: none; gap: 3px;
  }
  .card:hover .card-actions { display: flex; }
  .card-action-btn {
    background: var(--surface3); border: none; cursor: pointer;
    color: var(--text2); padding: 4px; border-radius: 4px;
    display: grid; place-items: center; transition: .12s;
  }
  .card-action-btn:hover { background: var(--accent); color: white; }
  .card-action-btn svg { width: 12px; height: 12px; }
  .card-action-btn.del:hover { background: var(--danger); }

  /* ── MODALS ── */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.65);
    backdrop-filter: blur(4px); z-index: 100;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--surface); border: 1px solid var(--border2);
    border-radius: 14px; padding: 28px; width: 520px; max-width: 95vw;
    box-shadow: 0 24px 80px rgba(0,0,0,.6);
    transform: translateY(12px) scale(.98);
    transition: transform .2s;
  }
  .overlay.open .modal { transform: none; }
  .modal h2 { font-size: 17px; font-weight: 700; margin-bottom: 20px; }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 5px; font-weight: 500; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  input[type=text], input[type=date], textarea, select {
    width: 100%; background: var(--surface2); border: 1px solid var(--border2);
    border-radius: var(--radius-sm); padding: 9px 12px;
    color: var(--text); font-family: inherit; font-size: 13px;
    outline: none; transition: border-color .15s;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  select option { background: var(--surface2); }
  textarea { resize: vertical; min-height: 80px; }
  .color-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .color-swatch {
    width: 26px; height: 26px; border-radius: 6px; cursor: pointer;
    border: 2px solid transparent; transition: .15s;
  }
  .color-swatch.active, .color-swatch:hover { border-color: white; transform: scale(1.1); }
  .modal-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
  .btn { padding: 8px 18px; border-radius: var(--radius-sm); border: none; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer; transition: .15s; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { background: var(--accent2); }
  .btn-ghost { background: var(--surface3); color: var(--text2); }
  .btn-ghost:hover { background: var(--surface2); color: var(--text); }
  .btn-danger { background: rgba(239,68,68,.15); color: #f87171; }
  .btn-danger:hover { background: var(--danger); color: white; }

  /* Tags input */
  .tags-input-wrap { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius-sm); min-height: 40px; cursor: text; }
  .tag-item { display: flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 3px; text-transform: uppercase; letter-spacing: .2px; }
  .tag-item button { background: none; border: none; cursor: pointer; font-size: 12px; opacity: .7; color: inherit; padding: 0 0 0 2px; }
  .tags-input { background: none; border: none; outline: none; color: var(--text); font-family: inherit; font-size: 12px; flex: 1; min-width: 80px; padding: 2px 4px; }
  .progress-input { display: flex; align-items: center; gap: 10px; }
  .progress-input input[type=range] { flex: 1; accent-color: var(--accent); }
  .progress-val { font-size: 12px; color: var(--text2); font-family: 'DM Mono', monospace; width: 32px; text-align: right; }

  /* Column context menu */
  .ctx-menu {
    position: fixed; background: var(--surface2); border: 1px solid var(--border2);
    border-radius: var(--radius-sm); padding: 4px; z-index: 200; min-width: 160px;
    box-shadow: var(--shadow);
  }
  .ctx-item { padding: 8px 12px; font-size: 13px; cursor: pointer; border-radius: 4px; display: flex; align-items: center; gap: 8px; color: var(--text2); transition: .1s; }
  .ctx-item:hover { background: var(--surface3); color: var(--text); }
  .ctx-item.danger { color: #f87171; }
  .ctx-item.danger:hover { background: rgba(239,68,68,.12); }

  /* Scrollbar */
  .board-wrap::-webkit-scrollbar { height: 6px; }
  .board-wrap::-webkit-scrollbar-track { background: transparent; }
  .board-wrap::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 4px; }

  .empty-col { color: var(--text3); font-size: 12px; text-align: center; padding: 16px 0; }

  /* Color picker for tags */
  .tag-color-opts { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
  .tag-color-opt { width: 20px; height: 20px; border-radius: 4px; cursor: pointer; border: 2px solid transparent; transition: .12s; }
  .tag-color-opt:hover, .tag-color-opt.sel { border-color: white; }
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-logo">
    <div class="header-logo-icon">
      <svg viewBox="0 0 16 16"><rect x="1" y="1" width="6" height="14" rx="2"/><rect x="9" y="1" width="6" height="9" rx="2"/></svg>
    </div>
    My Board
  </div>
  <div class="header-spacer"></div>
  <div class="header-stats" id="headerStats"></div>
  <button class="btn-add-col" onclick="openAddColumn()">
    <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="7" y1="1" x2="7" y2="13"/><line x1="1" y1="7" x2="13" y2="7"/></svg>
    Add Column
  </button>
</header>

<!-- BOARD -->
<div class="board-wrap">
  <div class="board" id="board"></div>
</div>

<!-- CARD MODAL -->
<div class="overlay" id="cardModal">
  <div class="modal">
    <h2 id="cardModalTitle">Add Card</h2>
    <div class="form-group">
      <label>Title *</label>
      <input type="text" id="cardTitle" placeholder="Card title…"/>
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="cardDesc" placeholder="Notes, details…"></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Priority</label>
        <select id="cardPriority">
          <option value="low">Low</option>
          <option value="normal" selected>Normal</option>
          <option value="high">High</option>
          <option value="critical">Critical</option>
        </select>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="cardStatus">
          <option value="active">Active</option>
          <option value="done">Done</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label>Progress</label>
      <div class="progress-input">
        <input type="range" id="cardProgress" min="0" max="100" value="0" oninput="document.getElementById('progressVal').textContent=this.value+'%'"/>
        <span class="progress-val" id="progressVal">0%</span>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Start Date</label>
        <input type="date" id="cardStart"/>
      </div>
      <div class="form-group">
        <label>Due Date</label>
        <input type="date" id="cardDue"/>
      </div>
    </div>
    <div class="form-group">
      <label>Tags <span style="color:var(--text3);font-weight:400">(type + Enter)</span></label>
      <div class="tags-input-wrap" id="tagsWrap" onclick="document.getElementById('tagInput').focus()">
        <input class="tags-input" id="tagInput" placeholder="Add tag…" onkeydown="handleTagKey(event)"/>
      </div>
      <div class="tag-color-opts" id="tagColorOpts"></div>
    </div>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="closeCardModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveCard()">Save Card</button>
    </div>
  </div>
</div>

<!-- COLUMN MODAL -->
<div class="overlay" id="colModal">
  <div class="modal">
    <h2 id="colModalTitle">Add Column</h2>
    <div class="form-group">
      <label>Column Name *</label>
      <input type="text" id="colTitle" placeholder="e.g. In Progress"/>
    </div>
    <div class="form-group">
      <label>Color</label>
      <div class="color-row" id="colColorRow"></div>
    </div>
    <div class="modal-btns">
      <button class="btn btn-ghost" onclick="closeColModal()">Cancel</button>
      <button class="btn btn-danger" id="colDeleteBtn" style="display:none" onclick="deleteColumn()">Delete</button>
      <button class="btn btn-primary" onclick="saveColumn()">Save</button>
    </div>
  </div>
</div>

<!-- CONTEXT MENU -->
<div class="ctx-menu" id="ctxMenu" style="display:none">
  <div class="ctx-item" onclick="ctxEdit()">
    <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9.5 2.5l2 2L4 12H2v-2L9.5 2.5z"/></svg>
    Edit column
  </div>
  <div class="ctx-item" onclick="ctxAddCard()">
    <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="1" y="1" width="12" height="12" rx="2"/><line x1="7" y1="4" x2="7" y2="10"/><line x1="4" y1="7" x2="10" y2="7"/></svg>
    Add card
  </div>
  <div class="ctx-item danger" onclick="ctxDelete()">
    <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="2,3 12,3"/><path d="M5,3V2h4v1"/><path d="M3,3l1,9h6l1-9"/></svg>
    Delete column
  </div>
</div>

<script>
// ── State ────────────────────────────────────────────────────────────────────
let board = [];
let editingCard = null;
let editingCardColId = null;
let editingCol = null;
let ctxColId = null;
let pendingTags = []; // [{label, color}]
let tagPendingColor = '#a78bfa';

const COL_COLORS = ['#f59e0b','#10b981','#3b82f6','#6366f1','#f97316','#ec4899','#22c55e','#0ea5e9','#8b5cf6','#ef4444','#14b8a6','#f43f5e'];
const TAG_COLORS_PALETTE = ['#a78bfa','#34d399','#fb923c','#38bdf8','#f472b6','#fbbf24','#6ee7b7','#818cf8','#f87171','#4ade80'];

// ── API ───────────────────────────────────────────────────────────────────────
const api = {
  async get(url) { const r = await fetch(url); return r.json(); },
  async post(url, data) { const r = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) }); return r.json(); },
  async put(url, data) { const r = await fetch(url, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) }); return r.json(); },
  async del(url) { const r = await fetch(url, { method:'DELETE' }); return r.json(); },
};

// ── Load & Render ─────────────────────────────────────────────────────────────
async function loadBoard() {
  board = await api.get('/api/board');
  renderBoard();
}

function renderBoard() {
  const el = document.getElementById('board');
  el.innerHTML = '';
  board.forEach(col => el.appendChild(makeColumn(col)));
  updateStats();
}

function makeColumn(col) {
  const div = document.createElement('div');
  div.className = 'column';
  div.dataset.colId = col.id;
  const count = col.cards.length;
  const limitStr = col.card_limit ? `<span class="col-limit">/${col.card_limit}</span>` : '';
  div.innerHTML = `
    <div class="col-header">
      <div class="col-drag-handle" title="Drag to reorder" onpointerdown="onColPointerDown(event,${col.id})">
        <svg width="10" height="14" viewBox="0 0 10 14" fill="currentColor"><circle cx="3" cy="2" r="1.3"/><circle cx="7" cy="2" r="1.3"/><circle cx="3" cy="7" r="1.3"/><circle cx="7" cy="7" r="1.3"/><circle cx="3" cy="12" r="1.3"/><circle cx="7" cy="12" r="1.3"/></svg>
      </div>
      <div class="col-color-bar" style="background:${col.color}"></div>
      <div class="col-title">${esc(col.title)}</div>
      <div class="col-count">${count}${limitStr}</div>
      <button class="col-menu-btn" onclick="openCtxMenu(event,${col.id})">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><circle cx="7" cy="3" r="1.2"/><circle cx="7" cy="7" r="1.2"/><circle cx="7" cy="11" r="1.2"/></svg>
      </button>
    </div>
    <div class="cards-list" id="cards-${col.id}"
      ondragover="onDragOver(event)" ondrop="onDrop(event,${col.id})"
      ondragleave="onDragLeave(event)">
      ${col.cards.length === 0 ? '<div class="empty-col">No cards yet</div>' : ''}
    </div>
    <div class="col-footer">
      <button class="btn-add-card" onclick="openAddCard(${col.id})">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" y1="1" x2="6" y2="11"/><line x1="1" y1="6" x2="11" y2="6"/></svg>
        Add card
      </button>
    </div>
  `;
  const list = div.querySelector('.cards-list');
  col.cards.forEach(card => list.appendChild(makeCard(card)));
  return div;
}

function makeCard(card) {
  const div = document.createElement('div');
  div.className = 'card';
  div.draggable = true;
  div.dataset.cardId = card.id;
  div.addEventListener('dragstart', e => onDragStart(e, card.id));
  div.addEventListener('dragend', onDragEnd);

  // Tags
  const tags = parseTags(card.tags, card.tag_colors);
  const tagsHtml = tags.length ? `<div class="card-tags">${tags.map(t =>
    `<span class="tag" style="background:${hexAlpha(t.color,.18)};color:${t.color}">${esc(t.label)}</span>`
  ).join('')}</div>` : '';

  // Badges
  const badges = [];
  if (card.priority !== 'normal') badges.push(`<span class="badge badge-priority-${card.priority}">${priIcon(card.priority)} ${capitalize(card.priority)}</span>`);
  if (card.status === 'done') badges.push(`<span class="badge badge-done">✓ Done</span>`);
  if (card.progress > 0 && card.status !== 'done') badges.push(`<span class="badge badge-progress">${card.progress}%</span>`);
  const badgesHtml = badges.length ? `<div class="card-badges">${badges.join('')}</div>` : '';

  // Progress bar
  const progColor = card.progress === 100 ? '#22c55e' : card.progress >= 50 ? '#3b82f6' : '#f59e0b';
  const progBar = card.progress > 0 ? `<div class="card-progress-bar"><div class="card-progress-fill" style="width:${card.progress}%;background:${progColor}"></div></div>` : '';

  // Dates
  const today = new Date().toISOString().slice(0,10);
  const datesHtml = [
    card.start_date ? `<span class="card-date"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="2" width="10" height="9" rx="1.5"/><line x1="4" y1="1" x2="4" y2="3"/><line x1="8" y1="1" x2="8" y2="3"/></svg>${fmtDate(card.start_date)}</span>` : '',
    card.due_date ? `<span class="card-date${card.due_date < today && card.status !== 'done' ? ' overdue' : ''}"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6" cy="6" r="5"/><polyline points="6,3 6,6 8,8"/></svg>${fmtDate(card.due_date)}</span>` : ''
  ].filter(Boolean).join('');

  div.innerHTML = `
    <div class="card-actions">
      <button class="card-action-btn" title="Edit" onclick="openEditCard(${card.id})">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 2l2 2L3.5 10H1.5v-2L8 2z"/></svg>
      </button>
      <button class="card-action-btn del" title="Delete" onclick="deleteCard(${card.id})">
        <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="2,2.5 10,2.5"/><path d="M4,2.5V2h4v.5"/><path d="M2.5,2.5l.8,7.5h5.4l.8-7.5"/></svg>
      </button>
    </div>
    ${tagsHtml}
    <div class="card-title">${esc(card.title)}</div>
    ${badgesHtml}
    ${progBar}
    ${datesHtml ? `<div class="card-footer">${datesHtml}</div>` : ''}
  `;
  return div;
}

function updateStats() {
  const total = board.reduce((a,c) => a + c.cards.length, 0);
  const done = board.reduce((a,c) => a + c.cards.filter(x => x.status === 'done').length, 0);
  document.getElementById('headerStats').innerHTML = `
    <div class="stat-pill"><span>${board.length}</span> columns</div>
    <div class="stat-pill"><span>${total}</span> cards</div>
    <div class="stat-pill">✓ <span>${done}</span> done</div>
  `;
}

// ── Column Drag & Drop (pointer events for smooth ghost) ──────────────────────
let draggingColId = null;
let colGhost = null;
let colGhostOffsetX = 0;
let colGhostOffsetY = 0;

function onColPointerDown(e, colId) {
  e.preventDefault();
  e.stopPropagation();

  draggingColId = colId;
  const colEl = document.querySelector(`.column[data-col-id="${colId}"]`);

  // Create ghost clone
  colGhost = colEl.cloneNode(true);
  colGhost.id = 'col-ghost';
  colGhost.style.width = colEl.offsetWidth + 'px';
  colGhost.style.height = colEl.offsetHeight + 'px';
  const rect = colEl.getBoundingClientRect();
  colGhostOffsetX = e.clientX - rect.left;
  colGhostOffsetY = e.clientY - rect.top;
  colGhost.style.left = (e.clientX - colGhostOffsetX) + 'px';
  colGhost.style.top  = (e.clientY - colGhostOffsetY) + 'px';
  document.body.appendChild(colGhost);

  colEl.classList.add('col-dragging');
  document.body.style.userSelect = 'none';
  document.body.style.cursor = 'grabbing';

  window.addEventListener('pointermove', onColPointerMove);
  window.addEventListener('pointerup', onColPointerUp);
}

function onColPointerMove(e) {
  if (!colGhost) return;
  colGhost.style.left = (e.clientX - colGhostOffsetX) + 'px';
  colGhost.style.top  = (e.clientY - colGhostOffsetY) + 'px';

  // Highlight drop target
  document.querySelectorAll('.column').forEach(c => {
    c.classList.remove('col-drag-over-left', 'col-drag-over-right');
  });
  const target = getColAtPoint(e.clientX, e.clientY);
  if (target && target.dataset.colId != draggingColId) {
    const rect = target.getBoundingClientRect();
    target.classList.add(e.clientX < rect.left + rect.width / 2 ? 'col-drag-over-left' : 'col-drag-over-right');
  }
}

async function onColPointerUp(e) {
  window.removeEventListener('pointermove', onColPointerMove);
  window.removeEventListener('pointerup', onColPointerUp);
  document.body.style.userSelect = '';
  document.body.style.cursor = '';

  if (colGhost) { colGhost.remove(); colGhost = null; }
  document.querySelectorAll('.column').forEach(c => {
    c.classList.remove('col-dragging', 'col-drag-over-left', 'col-drag-over-right');
  });

  const target = getColAtPoint(e.clientX, e.clientY);
  if (target && target.dataset.colId && parseInt(target.dataset.colId) !== draggingColId) {
    const targetColId = parseInt(target.dataset.colId);
    const rect = target.getBoundingClientRect();
    const dropBefore = e.clientX < rect.left + rect.width / 2;

    const cols = [...board];
    const fromIdx = cols.findIndex(c => c.id === draggingColId);
    let toIdx = cols.findIndex(c => c.id === targetColId);
    const [moved] = cols.splice(fromIdx, 1);
    const insertAt = (fromIdx < toIdx)
      ? (dropBefore ? toIdx - 1 : toIdx)
      : (dropBefore ? toIdx : toIdx + 1);
    cols.splice(Math.max(0, insertAt), 0, moved);

    const order = cols.map((c, i) => ({ id: c.id, position: i }));
    await api.post('/api/columns/reorder', { order });
    await loadBoard();
  }

  draggingColId = null;
}

function getColAtPoint(x, y) {
  // Temporarily hide ghost to hit-test underneath
  if (colGhost) colGhost.style.display = 'none';
  const el = document.elementFromPoint(x, y);
  if (colGhost) colGhost.style.display = '';
  return el ? el.closest('.column') : null;
}


let draggingId = null;

function onDragStart(e, id) {
  draggingId = id;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}
function onDragEnd(e) { e.currentTarget.classList.remove('dragging'); }
function onDragOver(e) {
  if (draggingColId) return; // ignore when dragging a column
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  e.currentTarget.closest('.column').classList.add('drag-over');
}
function onDragLeave(e) { e.currentTarget.closest('.column').classList.remove('drag-over'); }

async function onDrop(e, colId) {
  if (draggingColId) return; // ignore when dragging a column
  e.preventDefault();
  e.currentTarget.closest('.column').classList.remove('drag-over');
  if (!draggingId) return;
  const col = board.find(c => c.id === colId);
  const pos = col ? col.cards.length : 0;
  await api.post('/api/cards/move', { card_id: draggingId, column_id: colId, position: pos });
  await loadBoard();
  draggingId = null;
}

// ── Card Modal ────────────────────────────────────────────────────────────────
function openAddCard(colId) {
  editingCard = null;
  editingCardColId = colId;
  pendingTags = [];
  document.getElementById('cardModalTitle').textContent = 'Add Card';
  document.getElementById('cardTitle').value = '';
  document.getElementById('cardDesc').value = '';
  document.getElementById('cardPriority').value = 'normal';
  document.getElementById('cardStatus').value = 'active';
  document.getElementById('cardProgress').value = 0;
  document.getElementById('progressVal').textContent = '0%';
  document.getElementById('cardStart').value = '';
  document.getElementById('cardDue').value = '';
  renderTagsInput();
  openModal('cardModal');
  setTimeout(() => document.getElementById('cardTitle').focus(), 100);
}

function openEditCard(cardId) {
  const card = board.flatMap(c => c.cards).find(c => c.id === cardId);
  if (!card) return;
  editingCard = card;
  editingCardColId = card.column_id;
  pendingTags = parseTags(card.tags, card.tag_colors);
  document.getElementById('cardModalTitle').textContent = 'Edit Card';
  document.getElementById('cardTitle').value = card.title;
  document.getElementById('cardDesc').value = card.description || '';
  document.getElementById('cardPriority').value = card.priority;
  document.getElementById('cardStatus').value = card.status;
  document.getElementById('cardProgress').value = card.progress;
  document.getElementById('progressVal').textContent = card.progress + '%';
  document.getElementById('cardStart').value = card.start_date ? card.start_date.slice(0,10) : '';
  document.getElementById('cardDue').value = card.due_date ? card.due_date.slice(0,10) : '';
  renderTagsInput();
  openModal('cardModal');
}

async function saveCard() {
  const title = document.getElementById('cardTitle').value.trim();
  if (!title) { document.getElementById('cardTitle').focus(); return; }
  const data = {
    column_id: editingCardColId,
    title,
    description: document.getElementById('cardDesc').value,
    priority: document.getElementById('cardPriority').value,
    status: document.getElementById('cardStatus').value,
    progress: parseInt(document.getElementById('cardProgress').value),
    tags: pendingTags.map(t => t.label).join(','),
    tag_colors: pendingTags.map(t => t.color).join(','),
    start_date: document.getElementById('cardStart').value || null,
    due_date: document.getElementById('cardDue').value || null,
  };
  if (editingCard) {
    await api.put(`/api/cards/${editingCard.id}`, data);
  } else {
    await api.post('/api/cards', data);
  }
  closeCardModal();
  await loadBoard();
}

function closeCardModal() {
  document.getElementById('cardModal').classList.remove('open');
  editingCard = null;
}

// Tags
function renderTagsInput() {
  const wrap = document.getElementById('tagsWrap');
  const input = document.getElementById('tagInput');
  wrap.innerHTML = '';
  pendingTags.forEach((t, i) => {
    const span = document.createElement('span');
    span.className = 'tag-item';
    span.style.cssText = `background:${hexAlpha(t.color,.2)};color:${t.color}`;
    span.innerHTML = `${esc(t.label)}<button onclick="removeTag(${i})">×</button>`;
    wrap.appendChild(span);
  });
  wrap.appendChild(input);
  // Color options
  const opts = document.getElementById('tagColorOpts');
  opts.innerHTML = TAG_COLORS_PALETTE.map(c =>
    `<div class="tag-color-opt${c===tagPendingColor?' sel':''}" style="background:${c}" onclick="setTagColor('${c}')"></div>`
  ).join('');
}
function handleTagKey(e) {
  if (e.key === 'Enter' || e.key === ',') {
    e.preventDefault();
    const val = e.target.value.trim().replace(/,/g,'');
    if (val) { pendingTags.push({ label: val, color: tagPendingColor }); e.target.value = ''; renderTagsInput(); }
  }
}
function removeTag(i) { pendingTags.splice(i,1); renderTagsInput(); }
function setTagColor(c) { tagPendingColor = c; renderTagsInput(); }

// ── Column Modal ──────────────────────────────────────────────────────────────
let colPickedColor = '#6366f1';

function openAddColumn() {
  editingCol = null;
  colPickedColor = COL_COLORS[Math.floor(Math.random()*COL_COLORS.length)];
  document.getElementById('colModalTitle').textContent = 'Add Column';
  document.getElementById('colTitle').value = '';
  document.getElementById('colDeleteBtn').style.display = 'none';
  renderColColors();
  openModal('colModal');
  setTimeout(() => document.getElementById('colTitle').focus(), 100);
}
function openEditColumn(colId) {
  editingCol = board.find(c => c.id === colId);
  if (!editingCol) return;
  colPickedColor = editingCol.color;
  document.getElementById('colModalTitle').textContent = 'Edit Column';
  document.getElementById('colTitle').value = editingCol.title;
  document.getElementById('colDeleteBtn').style.display = 'block';
  renderColColors();
  openModal('colModal');
  hideCtx();
}
function renderColColors() {
  document.getElementById('colColorRow').innerHTML = COL_COLORS.map(c =>
    `<div class="color-swatch${c===colPickedColor?' active':''}" style="background:${c}" onclick="pickColColor('${c}')"></div>`
  ).join('');
}
function pickColColor(c) { colPickedColor = c; renderColColors(); }

async function saveColumn() {
  const title = document.getElementById('colTitle').value.trim();
  if (!title) { document.getElementById('colTitle').focus(); return; }
  const data = { title, color: colPickedColor };
  if (editingCol) {
    await api.put(`/api/columns/${editingCol.id}`, data);
  } else {
    await api.post('/api/columns', data);
  }
  closeColModal();
  await loadBoard();
}
function closeColModal() {
  document.getElementById('colModal').classList.remove('open');
  editingCol = null;
}
async function deleteColumn() {
  if (!editingCol) return;
  if (!confirm(`Delete "${editingCol.title}" and all its cards?`)) return;
  await api.del(`/api/columns/${editingCol.id}`);
  closeColModal();
  await loadBoard();
}

// ── Context Menu ──────────────────────────────────────────────────────────────
function openCtxMenu(e, colId) {
  e.stopPropagation();
  ctxColId = colId;
  const m = document.getElementById('ctxMenu');
  m.style.display = 'block';
  m.style.left = e.clientX + 'px';
  m.style.top = e.clientY + 'px';
}
function hideCtx() { document.getElementById('ctxMenu').style.display = 'none'; }
function ctxEdit() { hideCtx(); openEditColumn(ctxColId); }
function ctxAddCard() { hideCtx(); openAddCard(ctxColId); }
function ctxDelete() {
  hideCtx();
  const col = board.find(c => c.id === ctxColId);
  if (!col) return;
  if (!confirm(`Delete "${col.title}" and all its cards?`)) return;
  api.del(`/api/columns/${ctxColId}`).then(loadBoard);
}

// ── Delete Card ───────────────────────────────────────────────────────────────
async function deleteCard(id) {
  if (!confirm('Delete this card?')) return;
  await api.del(`/api/cards/${id}`);
  await loadBoard();
}

// ── Modal Helpers ─────────────────────────────────────────────────────────────
function openModal(id) { document.getElementById(id).classList.add('open'); }
document.addEventListener('click', e => {
  if (e.target.classList.contains('overlay')) {
    document.querySelectorAll('.overlay').forEach(o => o.classList.remove('open'));
  }
  if (!e.target.closest('.ctx-menu') && !e.target.closest('.col-menu-btn')) hideCtx();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.overlay').forEach(o => o.classList.remove('open'));
    hideCtx();
  }
});

// ── Helpers ───────────────────────────────────────────────────────────────────
function parseTags(tags, colors) {
  if (!tags) return [];
  const tArr = tags.split(',').filter(Boolean);
  const cArr = (colors || '').split(',');
  return tArr.map((t,i) => ({ label: t, color: cArr[i] || '#a78bfa' }));
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function hexAlpha(hex, a) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function fmtDate(d) {
  if (!d) return '';
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('en-US', { month:'short', day:'numeric' });
}
function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function priIcon(p) { return p==='high'?'⬆':'⬇'===p?'⬇':p==='critical'?'🔴':''; }

// ── Init ──────────────────────────────────────────────────────────────────────
loadBoard();
</script>
